<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="リアルタイム対戦パズルゲーム「ヘキサゴン」の公式サイトです。">
  <title>ヘキサゴン 公式サイト</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #080a10;
      --panel: #111620;
      --panel-soft: #151b27;
      --text: #f6f8fb;
      --muted: #aeb7c6;
      --line: rgba(255, 255, 255, .14);
      --cyan: #22d3ee;
      --green: #78f0b4;
    }

    * { box-sizing: border-box; }

    html { scroll-behavior: smooth; }

    body {
      margin: 0;
      min-width: 320px;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Yu Gothic", Meiryo, sans-serif;
      line-height: 1.75;
    }

    a { color: inherit; }

    img {
      display: block;
      width: 100%;
      height: auto;
    }

    .site-header {
      position: sticky;
      top: 0;
      z-index: 10;
      border-bottom: 1px solid var(--line);
      background: rgba(8, 10, 16, .92);
      backdrop-filter: blur(14px);
    }

    .nav {
      width: min(1120px, calc(100% - 32px));
      margin: 0 auto;
      padding: 14px 0;
      display: grid;
      grid-template-columns: auto minmax(0, 1fr);
      gap: 18px;
      align-items: center;
    }

    .brand {
      text-decoration: none;
      white-space: nowrap;
    }

    .brand strong {
      display: block;
      font-size: 20px;
      font-weight: 950;
      letter-spacing: .08em;
      line-height: 1.1;
    }

    .brand span {
      display: block;
      color: var(--muted);
      font-size: 11px;
      font-weight: 800;
      letter-spacing: .14em;
      line-height: 1.1;
    }

    .tabs {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 8px;
    }

    .tabs a {
      min-height: 42px;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 8px 10px;
      background: var(--panel);
      color: #eef4fb;
      font-size: 13px;
      font-weight: 900;
      line-height: 1.25;
      text-align: center;
      text-decoration: none;
    }

    .tabs a:hover,
    .tabs a:focus-visible {
      border-color: rgba(34, 211, 238, .8);
      outline: none;
    }

    main {
      width: min(1120px, calc(100% - 32px));
      margin: 0 auto;
    }

    .hero {
      padding: 48px 0 54px;
      display: grid;
      gap: 28px;
    }

    .hero-copy {
      max-width: 860px;
    }

    .kicker {
      margin: 0 0 10px;
      color: var(--green);
      font-size: 13px;
      font-weight: 950;
      letter-spacing: .12em;
    }

    h1 {
      margin: 0 0 14px;
      font-size: clamp(42px, 8vw, 92px);
      line-height: 1;
      letter-spacing: .03em;
    }

    .lead {
      margin: 0;
      max-width: 720px;
      color: var(--muted);
      font-size: clamp(16px, 2vw, 22px);
      font-weight: 800;
    }

    .hero-image {
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel);
    }

    section {
      padding: 48px 0;
      border-top: 1px solid var(--line);
    }

    .section-head {
      margin-bottom: 20px;
    }

    h2 {
      margin: 0 0 8px;
      font-size: clamp(28px, 5vw, 48px);
      line-height: 1.15;
    }

    .section-head p {
      margin: 0;
      color: var(--muted);
      font-weight: 750;
    }

    .screenshots {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 12px;
    }

    .screenshots img {
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel-soft);
    }

    .contact-form {
      max-width: 680px;
      display: grid;
      gap: 14px;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 20px;
      background: var(--panel);
    }

    label {
      display: grid;
      gap: 7px;
      color: #eef4fb;
      font-size: 14px;
      font-weight: 900;
    }

    input,
    textarea {
      width: 100%;
      border: 1px solid rgba(255, 255, 255, .18);
      border-radius: 8px;
      padding: 12px 13px;
      background: #090d14;
      color: var(--text);
      font: inherit;
      font-weight: 700;
    }

    textarea {
      min-height: 132px;
      resize: vertical;
    }

    input:focus,
    textarea:focus {
      border-color: rgba(34, 211, 238, .85);
      outline: none;
    }

    .form-help {
      margin: 0;
      color: var(--muted);
      font-size: 13px;
      font-weight: 750;
    }

    .button {
      min-height: 46px;
      border: 0;
      border-radius: 8px;
      padding: 0 18px;
      background: linear-gradient(90deg, var(--cyan), var(--green));
      color: #031116;
      font: inherit;
      font-weight: 950;
      cursor: pointer;
    }

    footer {
      border-top: 1px solid var(--line);
      padding: 28px 16px;
      color: var(--muted);
      text-align: center;
      font-size: 13px;
    }

    footer p { margin: 6px 0; }
    footer a { text-decoration: none; }

    @media (max-width: 840px) {
      .nav {
        grid-template-columns: 1fr;
      }

      .tabs {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      .screenshots {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
    }

    @media (max-width: 520px) {
      .tabs a {
        min-height: 44px;
        font-size: 12px;
        padding: 8px 6px;
      }

      .screenshots {
        grid-template-columns: 1fr;
      }

      .hero {
        padding-top: 34px;
      }
    }
  </style>
</head>
<body>
  <header class="site-header">
    <nav class="nav" aria-label="サイト内ナビゲーション">
      <a class="brand" href="./index.html" aria-label="ヘキサゴン公式サイト ホーム">
        <strong>ヘキサゴン</strong>
        <span>OFFICIAL SITE</span>
      </a>
      <div class="tabs">
        <a href="./terms.html">利用規約</a>
        <a href="./privacy.html">プライバシーポリシー</a>
        <a href="./tokushoho.html">特定商取引法表記</a>
        <a href="#contact">お問い合わせ</a>
      </div>
    </nav>
  </header>

  <main>
    <section class="hero" aria-label="ヘキサゴン">
      <div class="hero-copy">
        <p class="kicker">REALTIME HEX PUZZLE BATTLE</p>
        <h1>ヘキサゴン</h1>
        <p class="lead">同じ色を6つつなげて消す、リアルタイム対戦パズル。フォーメーションと連鎖で勝利を目指そう。</p>
      </div>
      <div class="hero-image">
        <img src="./assets/images/appstore/android-feature.png" alt="ヘキサゴンのキービジュアル">
      </div>
    </section>

    <section aria-labelledby="screens-title">
      <div class="section-head">
        <h2 id="screens-title">スクリーンショット</h2>
        <p>実際のゲーム画面です。</p>
      </div>
      <div class="screenshots">
        <img src="./assets/images/appstore/iphone-01.png" alt="ヘキサゴンのスクリーンショット1">
        <img src="./assets/images/appstore/iphone-02.png" alt="ヘキサゴンのスクリーンショット2">
        <img src="./assets/images/appstore/iphone-03.png" alt="ヘキサゴンのスクリーンショット3">
        <img src="./assets/images/appstore/iphone-04.png" alt="ヘキサゴンのスクリーンショット4">
        <img src="./assets/images/appstore/iphone-05.png" alt="ヘキサゴンのスクリーンショット5">
        <img src="./assets/images/appstore/iphone-06.png" alt="ヘキサゴンのスクリーンショット6">
      </div>
    </section>

    <section id="contact" aria-labelledby="contact-title">
      <div class="section-head">
        <h2 id="contact-title">お問い合わせ</h2>
      </div>
      <form class="contact-form" id="contactForm">
        <label>
          プレイヤー名
          <input id="playerName" name="playerName" type="text" autocomplete="name" placeholder="例: プレイヤー">
        </label>
        <label>
          プレイヤーID
          <input id="playerId" name="playerId" type="text" inputmode="text" placeholder="例: ABC123">
        </label>
        <label>
          お問い合わせ内容
          <textarea id="message" name="message" placeholder="できるだけ詳しく状況をご記入ください。"></textarea>
        </label>
        <p class="form-help">メールアプリが開き、入力内容を本文に入れた状態で送信準備をします。</p>
        <button class="button" type="submit">メールを作成</button>
      </form>
    </section>
  </main>

  <footer>
    <p><a href="./terms.html">利用規約</a> / <a href="./privacy.html">プライバシーポリシー</a> / <a href="./tokushoho.html">特定商取引法表記</a> / <a href="#contact">お問い合わせ</a></p>
    <p>&copy; 2026 Takutonkatsu. All rights reserved.</p>
  </footer>

  <script>
    const form = document.getElementById('contactForm');

    form.addEventListener('submit', (event) => {
      event.preventDefault();

      const playerName = document.getElementById('playerName').value.trim();
      const playerId = document.getElementById('playerId').value.trim();
      const message = document.getElementById('message').value.trim();
      const body = [
        'ヘキサゴンについて問い合わせます。',
        '',
        `プレイヤー名: ${playerName || '未入力'}`,
        `プレイヤーID: ${playerId || '未入力'}`,
        '',
        'お問い合わせ内容:',
        message || '未入力',
        '',
        '---',
        '送信前に内容をご確認ください。'
      ].join('\n');
      const subject = 'ヘキサゴン お問い合わせ';
      const mailto = `mailto:takutonkatsu.dev@gmail.com?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(body)}`;

      window.location.href = mailto;
    });
  </script>
</body>
</html>
