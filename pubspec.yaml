name: six_ball_puzzle
description: "Hexagon puzzle battle game."
publish_to: 'none'
version: 1.5.0+52

environment:
  sdk: ^3.0.0

dependencies:
  flutter:
    sdk: flutter
  flame: ^1.16.0
  firebase_core: ^4.7.0
  firebase_auth: ^6.1.0
  firebase_database: ^12.3.0
  shared_preferences: ^2.3.3
  audioplayers: ^6.6.0
  flame_audio: ^2.12.1
  google_mobile_ads: ^8.0.0
  firebase_app_check: ^0.4.3
  in_app_purchase: ^3.2.3
  in_app_purchase_storekit: ^0.4.8+1
  url_launcher: ^6.3.1
  app_tracking_transparency: ^2.0.6+1
  package_info_plus: ^10.1.0
  share_plus: ^13.1.0
  qr_flutter: ^4.1.0
  web_socket_channel: ^3.0.2
  app_links: ^7.2.1
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  config:
    enable-swift-package-manager: false
  uses-material-design: true
  assets:
    - assets/rl_model.json
    - assets/audio/
    - assets/images/
    - assets/images/HomeNav/
    - assets/images/HomeActions/
    - assets/images/HomeModes/
    - assets/images/PlayerIcons/
    - assets/images/ResultWaza/
    - assets/images/BallSkins/
    - assets/images/BattleStamps/
    - assets/images/Badge/
