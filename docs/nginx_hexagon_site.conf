server {
    listen 80;
    server_name takutonkatsu.com www.takutonkatsu.com;

    root /var/www;
    index index.html;

    location = / {
        return 302 /hexagon/;
    }

    location = /privacy.html {
        return 301 /hexagon/privacy.html;
    }

    location = /terms.html {
        return 301 /hexagon/terms.html;
    }

    location = /tokushoho.html {
        return 301 /hexagon/tokushoho.html;
    }

    location = /privacy {
        return 301 /hexagon/privacy.html;
    }

    location = /terms {
        return 301 /hexagon/terms.html;
    }

    location = /tokushoho {
        return 301 /hexagon/tokushoho.html;
    }

    location = /app-ads.txt {
        try_files /hexagon/app-ads.txt =404;
    }

    location /hexagon/ {
        try_files $uri $uri/ =404;
    }

    location ~* \.(?:css|js|png|jpg|jpeg|gif|webp|ico|svg)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        try_files $uri =404;
    }
}
